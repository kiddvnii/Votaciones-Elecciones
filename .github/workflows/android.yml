name: Android build

on:
  pull_request:
  push:
    branches:
      - main
      - feature/alternativas-gratis-firebase

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$sdkmanager_bin"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" "platforms;android-36" "build-tools;35.0.0"
      - name: Compile debug and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease :app:bundleRelease :app:testDebugUnitTest --no-daemon
      - name: Java 21 for the host inference library
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run actual bundled chatbot inference
        run: ./gradlew :verificacion:run --no-daemon
      - name: Verify bundled models and licenses
        run: python3 tools/verificar_paquetes.py
      - name: Verify APK 16 KB alignment
        run: |
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$apk"
          done
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
      - name: Upload ready-to-install APK
        uses: actions/upload-artifact@v4
        with:
          name: app-lista-para-instalar
          compression-level: 0
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Play bundle with install-time models
        uses: actions/upload-artifact@v4
        with:
          name: bundle-play-con-modelos
          compression-level: 0
          path: app/build/outputs/bundle/release/app-release.aab
